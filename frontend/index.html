<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FAF8F5" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Flobooking" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="192x192" />
  <meta name="description"
    content="Flo Sisterlocks — Certified Sisterlocks studio in Eldoret. Book professional installation, retightening, and beauty services online." />
  <title>Flo Sisterlocks, Eldoret</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FAF8F5;
      overflow-x: hidden;
    }
    .app-initial-loader {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FAF8F5;
      user-select: none;
      -webkit-user-select: none;
      z-index: 99999;
    }
    .loader-ambient-glow {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 70, 111, 0.16) 0%, rgba(232, 130, 159, 0.05) 50%, rgba(250, 248, 245, 0) 70%);
      animation: loaderGlowPulse 2.4s ease-in-out infinite;
      pointer-events: none;
    }
    .loader-ring-wrapper {
      position: relative;
      width: 56px;
      height: 56px;
    }
    .loader-orbital-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(196, 70, 111, 0.12);
      border-top-color: #C4466F;
      border-right-color: #E8829F;
      animation: loaderSpin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }
    .loader-inner-ring {
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: #C4466F;
      border-left-color: rgba(196, 70, 111, 0.4);
      animation: loaderSpinReverse 1.3s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }
    .loader-center-spark {
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      background: #C4466F;
      box-shadow: 0 0 10px rgba(196, 70, 111, 0.6);
      animation: loaderSparkPulse 1.8s ease-in-out infinite;
    }
    .loader-brand-line {
      margin-top: 28px;
      width: 32px;
      height: 2px;
      border-radius: 9999px;
      background: linear-gradient(90deg, transparent, rgba(196, 70, 111, 0.4), transparent);
      animation: loaderLinePulse 1.8s ease-in-out infinite;
    }
    @keyframes loaderSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes loaderSpinReverse {
      to { transform: rotate(-360deg); }
    }
    @keyframes loaderGlowPulse {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.25); opacity: 0.95; }
    }
    @keyframes loaderSparkPulse {
      0%, 100% { transform: scale(0.85); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes loaderLinePulse {
      0%, 100% { opacity: 0.3; transform: scaleX(0.7); }
      50% { opacity: 0.8; transform: scaleX(1.3); }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="app-initial-loader" aria-label="Loading Flo Sisterlocks">
      <div class="loader-ambient-glow"></div>
      <div class="loader-ring-wrapper">
        <div class="loader-orbital-ring"></div>
        <div class="loader-inner-ring"></div>
        <div class="loader-center-spark"></div>
      </div>
      <div class="loader-brand-line"></div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
